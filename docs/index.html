        <h1>Geolocation</h1>
        <p>Use the geoLocation action methods getCurrentPosition, watchPosition, and clearWatch. The browser may request permission and requires a secure context.</p>
        <h2>Usage</h2>
        <pre><code>&lt;button actions="geoLocation.getCurrentPosition"&gt;Get location&lt;/button&gt;</code></pre>
